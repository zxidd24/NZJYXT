server:
  port: 8080

spring:
  application:
    name: agri-admin-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agri_trading}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.nzxhjy.agri.service.entity

agri:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:7200000}
  aes:
    key: ${AGRI_AES_KEY}
  upload:
    path: ${UPLOAD_PATH:./uploads}
  order-timeout:
    enabled: ${ORDER_TIMEOUT_ENABLED:false}
    fixed-delay-ms: ${ORDER_TIMEOUT_FIXED_DELAY_MS:60000}
